<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCU Chronicle — Hybrid Master Order Tracker</title>
<meta name="description" content="Track your MCU watch order, log real runtimes automatically, and see your total screen time." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">
  <div class="ambient-field" id="ambientField" aria-hidden="true"></div>

  <div class="snap-overlay" id="snapOverlay" hidden>
    <span class="snap-text">SNAP.</span>
    <span class="snap-sub">Hybrid order complete. MCU journey finished.</span>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-eyebrow">HYBRID MASTER ORDER · AUTO-TIMED</span>
      <h1 class="brand-title">MCU CHRONICLE</h1>
    </div>
    <div class="gauntlet" id="gauntlet"></div>
  </header>

  <nav class="tabs">
    <button class="tab tab--active" id="tabWatchlist" data-tab="watchlist">Watchlist</button>
    <button class="tab" id="tabChronicle" data-tab="chronicle">Time Log</button>
    <button class="tab tab--reset" id="resetBtn" title="Reset everything">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
  </nav>

  <main class="app-main">
    <div id="watchlistView"></div>
    <div id="chronicleView" hidden></div>
  </main>

  <footer class="app-footer">
    <span>Progress saves automatically in this browser · Made for Veer's Hybrid Master Order</span>
  </footer>
</div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
